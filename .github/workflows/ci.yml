# The full check on every PR and on main, on the three platforms megha users run it on.
# `bun run check` = agent offline tests, site lint, typecheck and production build (root package.json).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      # The agent's tests run under node (packages/megha: `node test/offline.mjs`), and megha needs Node 22+.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Bun version comes from "packageManager" in package.json, so CI and local installs match.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run check
